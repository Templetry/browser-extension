schema_version: 1
name: browser-extension-wxt-svelte
description: Chromium extension (Manifest V3) — WXT + Svelte 5 + TypeScript, popup and service worker, optional options page, content script and Vitest
kinds: [frontend]
languages: [typescript]
frameworks: [wxt, svelte, vite]

variables:
  - key: project_name
    label: Extension name
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9 ]*$"

identity:
  - from: "Template App"           # manifest name, page titles, headings
    to: "{project_name}"
  - from: "TemplateApp"            # docs
    to: "{project_name.pascal}"
  - from: "template-app"           # package.json name
    to: "{project_name.kebab}"

features:
  - key: options
    label: Options page (opens in a tab)
    default: true
    files: ["entrypoints/options/**"]

  - key: content_script
    label: Content script (injected into matching pages)
    default: true
    files: ["entrypoints/content.ts"]

  - key: vitest
    label: Vitest unit tests
    default: true
    files: ["tests/**"]

presets:
  - key: full
    label: Everything on
    features: {options: true, content_script: true, vitest: true}
  - key: minimal
    label: Popup and service worker only
    features: {options: false, content_script: false, vitest: false}

verify:
  image: node:22
  run: npm install && npm run build
